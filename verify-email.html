<!DOCTYPE html>
<html>
<head>
    <title>Email Verification - SYNARA</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .verify-container {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo img { height: 60px; margin-bottom: 24px; }
        h2 { font-size: 28px; margin-bottom: 16px; color: #1e293b; }
        p { color: #64748b; margin-bottom: 24px; line-height: 1.5; }
        .status { padding: 16px; border-radius: 16px; margin-bottom: 24px; }
        .status-success { background: #d1fae5; color: #065f46; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-pending { background: #fef3c7; color: #92400e; }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .resend-link { margin-top: 16px; font-size: 12px; }
        .resend-link a { color: #10b981; text-decoration: none; }
    </style>
</head>
<body>
<div class="verify-container">
    <div class="logo"><img src="/images/synara-logo.png" alt="SYNARA"></div>
    <h2 id="title">Verifying your email...</h2>
    <div id="status" class="status status-pending">Please wait...</div>
    <div id="resendBtn" style="display:none;">
        <button onclick="resendVerification()">📧 Resend Verification Email</button>
    </div>
    <div class="resend-link"><a href="/apply-agent.html">← Back to Application</a></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');
    
    async function verifyEmail() {
        if (!token && !email) {
            document.getElementById('title').innerText = 'Invalid verification link';
            document.getElementById('status').innerHTML = 'No verification token provided. Please use the link from your email.';
            document.getElementById('status').className = 'status status-error';
            return;
        }
        
        try {
            const res = await fetch('/api/verify-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, email })
            });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('title').innerText = '✅ Email Verified!';
                document.getElementById('status').innerHTML = 'Your email has been verified. Your application will now be reviewed by our team. You will receive an SMS/Email once approved.';
                document.getElementById('status').className = 'status status-success';
            } else {
                document.getElementById('title').innerText = 'Verification Failed';
                document.getElementById('status').innerHTML = data.error || 'Invalid or expired verification link.';
                document.getElementById('status').className = 'status status-error';
                document.getElementById('resendBtn').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('status').innerHTML = 'Connection error. Please try again.';
            document.getElementById('status').className = 'status status-error';
        }
    }
    
    async function resendVerification() {
        const res = await fetch('/api/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
            alert('Verification email resent! Please check your inbox.');
        } else {
            alert(data.error || 'Failed to resend. Please contact support.');
        }
    }
    
    verifyEmail();
</script>
</body>
</html>
